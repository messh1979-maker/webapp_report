{% extends "base.html" %}
{% block title %}ویرایش شهر{% endblock %}
{% block content %}<div class="row justify-content-center"><div class="col-lg-7"><div class="card shadow-sm"><div class="card-header bg-white"><h5 class="mb-0">ویرایش مرجع شهر</h5></div><div class="card-body"><div class="alert alert-info">تغییر نام یا کد در تمام ساختمان‌ها و کاربران مرتبط به‌صورت خودکار دیده می‌شود و داده‌ای تکرار نمی‌گردد.</div><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label class="form-label required">کد شهر</label><input name="code" maxlength="30" class="form-control" required value="{{ request.form.get('code',city.code) }}"></div><div class="mb-3"><label class="form-label required">نام شهر</label><input name="name" maxlength="100" class="form-control" required value="{{ request.form.get('name',city.name) }}"></div><div class="form-check mb-3"><input type="checkbox" class="form-check-input" name="is_active" value="1" id="active" {{ 'checked' if request.form.get('is_active','1' if city.is_active else '0')=='1' }}><input type="hidden" name="is_active" value="0"><label class="form-check-label" for="active">شهر فعال باشد</label></div><button class="btn btn-primary">ذخیره</button> <a href="{{ url_for('admin_cities') }}" class="btn btn-outline-secondary">انصراف</a></form></div></div></div></div>{% endblock %}
